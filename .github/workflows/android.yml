name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test playback state
        run: node --test tests/player.test.cjs
      - name: Prepare native engine
        run: bash ci/core.sh
      - name: Set subscription
        env:
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
        run: |
          test -n "$SUBSCRIPTION_URL" || { echo "Missing subscription secret"; exit 1; }
          umask 077
          printf '%s' "$SUBSCRIPTION_URL" > app/src/main/assets/subscription.txt
      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in app/build/outputs/apk/release/app-release-unsigned.apk -out dist/movie.apk.cms ci/transport.pem
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -F "package: name='com.jiyu.movie' versionCode='3'"
      - uses: actions/upload-artifact@v4
        with:
          name: movie-android
          path: dist/movie.apk.cms
          if-no-files-found: error
